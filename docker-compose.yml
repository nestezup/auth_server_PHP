version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestezup/auth_server_php:latest
    container_name: auth_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "9000:9000"
    networks:
      - auth_network

  db:
    image: mariadb:10.6
    container_name: auth_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-user}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - auth_network

  redis:
    image: redis:alpine
    container_name: auth_redis
    restart: unless-stopped
    networks:
      - auth_network

  nginx:
    image: nginx:alpine
    container_name: auth_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - auth_network

networks:
  auth_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
